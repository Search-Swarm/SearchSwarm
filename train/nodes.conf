# ==============================================================================
# Megatron-SWIFT multi-node training configuration - the only file to edit manually
# After editing, run: bash configure.sh
# ==============================================================================

# ---- Node IP list (first is the head node; default 8 nodes x 8 H200 = 64 GPUs) ----
NODES=(
    xxx.xxx.xxx.xxx    # node0 (head node)
    xxx.xxx.xxx.xxx    # node1
    xxx.xxx.xxx.xxx    # node2
    xxx.xxx.xxx.xxx    # node3
    xxx.xxx.xxx.xxx    # node4
    xxx.xxx.xxx.xxx    # node5
    xxx.xxx.xxx.xxx    # node6
    xxx.xxx.xxx.xxx    # node7
)

# ---- SSH username ----
SSH_USER=your_ssh_user

# ---- Data path (pre-tokenized cache directory) ----
# Megatron training uses --cached_dataset by default, skipping the tokenize step for faster experiment startup
DATA_PATH=/path/to/cached_dataset/train

# ---- Model (HuggingFace name or local absolute path; mcore-bridge loads online, no need to convert to mcore first) ----
MODEL_PATH=Qwen/Qwen3-30B-A3B-Thinking-2507

# ---- Output directory ----
OUTPUT_DIR=./megatron_output/qwen3-30b-a3b-thinking-sft

# ---- GPUs per machine ----
NPROC_PER_NODE=8

# ---- (Optional) Parallelism override; blank = script defaults TP=4 PP=2 EP=4 (CP=2) ----
# Uncomment and edit to override (these feed train_megatron_multinode.sh):
# TP=4
# PP=2
# EP=4
